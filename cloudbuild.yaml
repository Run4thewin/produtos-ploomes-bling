# Build + deploy no Cloud Run.
# Disparado manualmente (gcloud builds submit) ou por trigger Git (push na branch main).

substitutions:
  _REGION: us-central1
  _REPOSITORY: ploomes-bling
  # Nome real do servico ja deployado (confirmado via `gcloud run services
  # list`) -- nao "ploomes-bling-sync". Um _SERVICE errado aqui faria o
  # proximo deploy CRIAR um servico novo em vez de atualizar o existente,
  # perdendo config como --max-instances=1 (ver step de deploy abaixo).
  _SERVICE: produtos-ploomes-bling
  _QUEUE: ploomes-bling-products
  _PLOOMES_GROUP_ID: "1100000674"
  # Bucket dedicado para o token OAuth do Bling (bling/tokens.json). Sem isso,
  # o token era gravado no disco efemero do proprio container (FileTokenStore
  # de fallback em app/clients/token_store.py) -- todo redeploy ou reinicio de
  # instancia perdia o token renovado, e como o refresh_token do Bling e' de
  # uso unico, qualquer renovacao feita fora (ex: rodando blng_fetcher local)
  # invalidava o token que producao tinha guardado, causando invalid_grant.
  # Criado 2026-08-13 apos o Deal 1106832863 falhar por esse motivo.
  _GCS_BUCKET: "cmc-bling-tokens"
  _SERVICE_URL: ""
  _TASKS_SA: ""
  _PLOOMES_WEBHOOK_KEY: cmc-ploomes-bling-webhook
  # Postgres (bling_order_links, bling_produtos). Requer conectividade Cloud Run -> Cloud SQL
  # (Cloud SQL Auth Proxy / --add-cloudsql-instances) configurada fora deste arquivo, e o
  # secret db-password criado no Secret Manager antes do primeiro deploy com essas flags.
  _DB_HOST: ""
  _DB_PORT: "5432"
  _DB_NAME: ""
  _DB_USER: "api_user"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --timeout=3600
      # O rate limiter do Bling (app/clients/rate_limit.py) e' um singleton em
      # memoria do processo -- nao coordena entre instancias. Com mais de 1
      # instancia do servico rodando ao mesmo tempo, a soma das requisicoes
      # ultrapassa o limite de 3 req/s do Bling e gera 429 mesmo sem ter
      # atingido a cota diaria. O teto e' da conta Bling inteira, entao mais
      # instancias nunca aumentam a vazao real -- so travar em 1 elimina o
      # estouro sem perder throughput de verdade.
      - --max-instances=1
      - --set-secrets=BLING_CLIENT_ID=bling-client-id:latest,BLING_CLIENT_SECRET=bling-client-secret:latest,PLOOMES_USER_KEY=ploomes-user-key:latest,INTERNAL_SECRET=internal-secret:latest,DB_PASSWORD=db-password:latest
      # PLOOMES_DEAL_SALES_ORDER_ID_FIELD aponta pro campo "N. Pedido Bling"
      # (deal_6454B19E-...), ja existente no Ploomes e sem uso anterior. Vira a
      # fonte de verdade do vinculo Deal->pedido de venda (dispensa o fallback
      # Postgres em DB_HOST/DB_NAME acima, que nunca teve conectividade real
      # com o Cloud Run). Sem essa env var, o Deal fica sem forma confiavel de
      # saber que ja tem pedido criado e recria pedido a cada webhook repetido
      # do Ploomes enquanto o Deal permanecer no estagio-gatilho.
      # PLOOMES_DEAL_AUTOMATION_SKIP_IDS: trava manual TEMPORARIA (incidente Deal
      # 1107321216, 2026-08-07 -- 39 pedidos duplicados). Deal 1107214887 precisa
      # ir pra Logistica manualmente sem reacionar a automacao (ja passou pelo
      # processo, e o pedido 9057/26438764111 vinculado a ele foi mexido durante
      # o loop). Remover este id daqui assim que o Deal for movido e confirmado.
      - --update-env-vars=^@^USE_CLOUD_TASKS=true@GCP_PROJECT=$PROJECT_ID@CLOUD_TASKS_LOCATION=${_REGION}@CLOUD_TASKS_QUEUE=${_QUEUE}@PLOOMES_GROUP_ID=${_PLOOMES_GROUP_ID}@GCS_BUCKET=${_GCS_BUCKET}@SERVICE_URL=${_SERVICE_URL}@CLOUD_TASKS_SERVICE_ACCOUNT=${_TASKS_SA}@PLOOMES_WEBHOOK_VALIDATION_KEY=${_PLOOMES_WEBHOOK_KEY}@PLOOMES_PRODUCT_ENTITY_ID=10@BLING_TOKENS_PATH=bling/tokens.json@DB_HOST=${_DB_HOST}@DB_PORT=${_DB_PORT}@DB_NAME=${_DB_NAME}@DB_USER=${_DB_USER}@PLOOMES_DEAL_SALES_ORDER_ID_FIELD=deal_6454B19E-E39A-4909-BFD0-3CADB493D4D3@PLOOMES_DEAL_AUTOMATION_SKIP_IDS=1107214887

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
